[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "D",   # pydocstyle
  "ASYNC",
]
ignore = [
  "D203",  # one-blank-line-before-class (conflicts with D211)
  "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.intergas_xtend"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# gen_codes.py embeds paragraphs quoted verbatim from the manual; they must not
# be re-wrapped.
"scripts/gen_codes.py" = ["E501"]
# codes.py is generated by scripts/gen_codes_py.py and quotes the manual verbatim.
"custom_components/intergas_xtend/codes.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
